name: Validar y desplegar en Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-render-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar sintaxis
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Solicitar despliegue en Render
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "ERROR: el secret DEPLOY_HOOK_URL no existe o está vacío"
            exit 1
          fi

          response_file="$(mktemp)"
          http_code=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "$DEPLOY_HOOK_URL") || {
              echo "ERROR: no se pudo conectar con el Deploy Hook"
              cat "$response_file"
              exit 1
            }

          echo "Render respondió HTTP $http_code"
          cat "$response_file"

          case "$http_code" in
            200|202) echo "Despliegue solicitado correctamente" ;;
            *) echo "ERROR: Render rechazó el Deploy Hook"; exit 1 ;;
          esac
