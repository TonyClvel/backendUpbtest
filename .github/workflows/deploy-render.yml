name: Validar y desplegar en Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-render-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar sintaxis
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Solicitar despliegue en Render
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Falta el secret DEPLOY_HOOK_URL"
            exit 1
          fi
          curl --fail-with-body --request POST "$DEPLOY_HOOK_URL"
